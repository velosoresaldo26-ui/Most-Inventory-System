<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventory System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1d2433;--mute:#6b7488;--line:#dfe3ec;--pri:#1f5eff;--pri2:#e8efff;--ok:#12805c;--warn:#b7791f;--bad:#c0392b}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#14213d;color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:650}
header small{color:#aeb8d0}
nav{display:flex;gap:4px;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--line);padding:8px 16px;position:sticky;top:0;z-index:5}
nav button{border:0;background:none;padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit;color:var(--mute);font-weight:550}
nav button.on{background:var(--pri2);color:var(--pri)}
main{padding:18px;max-width:1500px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.stat b{display:block;font-size:24px;margin-top:2px}.stat span{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
.bar input,.bar select{width:auto;min-width:150px}
button.b{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit;font-weight:550}
button.b:hover{background:#f1f3f8}
button.p{background:var(--pri);color:#fff;border-color:var(--pri)}button.p:hover{background:#174fd9}
button.d{color:var(--bad)}
.sp{flex:1}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:68vh}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#eef1f7;position:sticky;top:0;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--mute)}
td.n,th.n{text-align:right}
tr:hover td{background:#fafbfe}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;background:#eef1f7}
.tag.PPE{background:#e8efff;color:#1f5eff}.tag.ICS{background:#f3e8ff;color:#7a3db8}.tag.Serviceable{background:#dff5ec;color:var(--ok)}.tag.Unserviceable,.tag.Lost{background:#fbe3e0;color:var(--bad)}.tag.For{background:#fdf0d5;color:var(--warn)}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:20}
.modal.show{display:flex}
.mb{background:#fff;border-radius:14px;padding:20px;width:min(900px,100%)}
.mb h3{margin:0 0 14px}
.fg{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.fg label{font-size:12px;color:var(--mute);font-weight:600;display:block;margin-bottom:3px}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.empty{text-align:center;color:var(--mute);padding:34px}
.hide{display:none!important}
.ml{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.ml textarea{height:150px;font-size:13px}
.ml label{font-weight:600;font-size:13px}
/* print forms */
.form{background:#fff;color:#000;padding:20px;border:1px solid var(--line);font-family:Arial,sans-serif}
.form h2,.form h3{text-align:center;margin:2px 0}
.form .meta{display:flex;gap:24px;flex-wrap:wrap;margin:12px 0;font-size:13px}
.form table{font-size:11px}.form th,.form td{border:1px solid #000;white-space:normal;padding:4px 5px;position:static;background:#fff;color:#000}
.form th{background:#eee;text-align:center}
.sig{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:30px;text-align:center;font-size:12px}
.sig div div{border-top:1px solid #000;margin-top:34px;padding-top:4px;font-weight:700;min-height:20px}
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.8cm,9.8cm));gap:3mm;justify-content:start}
.st2{width:9.8cm;height:4.5cm;border:1px solid #000;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;padding:2mm 3mm 1.5mm;display:flex;flex-direction:column;break-inside:avoid;overflow:hidden;position:relative}
.st2 .hd{text-align:center;font-size:7pt;line-height:1.1}.st2 .hd b{font-size:8.5pt}
.st2 .bd{display:flex;gap:3mm;flex:1;margin-top:1mm;min-height:0}
.st2 .tx{flex:1;font-size:6.4pt;line-height:1.12;min-width:0}
.st2 .no{font:700 10.5pt 'Courier New',monospace;margin-bottom:.5mm}
.st2 .tx div{word-break:break-word}.st2 .qr{width:2.7cm;height:2.7cm;flex:none}.st2 .qr svg{width:100%;height:100%;display:block}
.st2 .sg{display:flex;gap:4mm;margin-top:auto;padding-top:1mm;font-size:6pt;text-align:center}.st2 .sg span{flex:1;border-top:1px solid #000;padding-top:.6mm}
.stctl input{width:auto;min-width:230px}
#lg{display:none;min-height:80vh;align-items:center;justify-content:center;padding:16px}
.locked #lg{display:flex}.locked nav,.locked main,.locked #syncb{display:none}
#lg .card{width:min(420px,100%);margin:0}#lg label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin:10px 0 3px}
.who{font-size:13px;color:var(--mute);align-self:center;padding:0 6px}
@page{size:A4 landscape;margin:10mm}
@page stk{size:A4 portrait;margin:5mm}
@media print{
 header,nav,.noprint,.modal{display:none!important}
 body{background:#fff}main{padding:0;max-width:none}
 .card{border:0;padding:0;margin:0}.form{border:0;padding:0}
 .stkpage{page:stk}.stk{gap:2mm}
}
</style>
</head>

<header><h1>📦 Inventory System</h1><span id="syncb" class="tag" style="margin-left:auto"></span><small>Region Property • Laboratory Equipment • Inventory Count Form • Property Stickers</small></header>

<div id="lg"></div>

<script>/* qrcode-generator 2.0.4 (MIT) – inlined so QR works offline */
//---------------------------------------------------------------------

// QR Code Generator for JavaScript

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';

function edit(m,id){
 if(!isAdmin())return;
 const r=id?S[m].find(x=>x.id===id):{};
 const dl=MASTER_DEFS.map(([k])=>`<datalist id="dl_${k}">${S.master[k].map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`).join('');
 mb.innerHTML=`<h3>${id?'Edit':'New'} ${MODS[m].name}</h3>${dl}<form id="fm" onsubmit="return saveRec(event,'${m}','${id||''}')"><div class="fg">`+
 MODS[m].fields.map(f=>{
  const v=r[f.k]??'';const L=`<label>${f.l}</label>`;
  if(f.t==='calc')return`<div>${L}<input id="f_total" readonly value="${money(r.total||0)}"></div><div><label>Classification (auto)</label><input id="f_cls" readonly value="${cls(r)||'—'}"></div>`;
  if(f.t==='area')return`<div style="grid-column:1/-1">${L}<textarea name="${f.k}" rows="2">${esc(v)}</textarea></div>`;
  return`<div>${L}<input name="${f.k}" value="${esc(v)}" ${f.t==='num'?'type="number" step="any" min="0"':f.t==='date'?'type="date"':''} ${f.list?`list="dl_${f.list}"`:''} ${f.k==='unitCost'||f.k==='qty'?'oninput="calcT()"':''}></div>`}).join('')+
 `</div><div class="mf"><button type="button" class="b" onclick="closeM()">Cancel</button><button class="b p">💾 Save</button></div></form>`;
 modal.classList.add('show');
}
function calcT(){const f=fm.elements;document.getElementById('f_total').value=money(num(f.unitCost.value)*num(f.qty.value));document.getElementById('f_cls').value=cls({unitCost:f.unitCost.value})||'—'}
function closeM(){modal.classList.remove('show')}
function saveRec(e,m,id){
 e.preventDefault();if(!isAdmin())return false;const d={};
 MODS[m].fields.forEach(f=>{if(f.t!=='calc')d[f.k]=fm.elements[f.k].value.trim()});
 d.total=num(d.unitCost)*num(d.qty);
 if(id){Object.assign(S[m].find(x=>x.id===id),d)}else{d.id='i'+(S.seq++)+Date.now().toString(36);S[m].push(d)}
 // auto-add new dropdown values sa Master Data
 [['section','section'],['empStatus','empStatus'],['category','category'],['sub','sub'],['fund','fund'],['txType','txType'],['ics','ics'],['uom','uom'],['condition','condition'],['status','status'],['accountable','permanent']].forEach(([f,k])=>{
  if(d[f]&&!S.master[k].includes(d[f]))S.master[k].push(d[f])});
 save();closeM();render();return false;
}
function dup(m,id){if(!isAdmin())return;const r={...S[m].find(x=>x.id===id),id:'i'+(S.seq++)+Date.now().toString(36)};S[m].push(r);save();render()}
function del(m,id){if(isAdmin()&&confirm('Delete this item?')){S[m]=S[m].filter(x=>x.id!==id);save();render()}}

/* ========= DOWNLOAD INVENTORY COUNT FORM AS EXCEL ========= */
function loadScript(src){return new Promise((ok,no)=>{const x=document.createElement('script');x.src=src;x.onload=ok;x.onerror=()=>{x.remove();no(new Error('load failed'))};document.head.appendChild(x)})}
async function downloadIcf(){
 try{
  if(!window.ExcelJS){
   try{await loadScript('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js')}
   catch(e){await loadScript('https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js')}
  }
 }catch(e){return alert('Could not load the Excel library (internet required).')}
 const lab=icf.m==='lab';
 const rows=S[icf.m].filter(r=>(!icf.sec||r.section===icf.sec)&&(!icf.cat||cls(r)===icf.cat)&&(!icf.pc||pcOf(r)===icf.pc));
 const heads=['No.','Article/Item','Description','Old Prop. No.','New Prop. No.','Unit of Measurement','Unit Value','Qty. per Property Card','Qty. per Physical Count','Location / Whereabouts','Condition','Remarks',...(lab?[]:['Property Category'])];
 const widths=[6,20,42,15,20,13,14,13,13,22,14,22,...(lab?[]:[18])];
 const n=heads.length,thin={style:'thin',color:{argb:'FF000000'}},box={top:thin,left:thin,bottom:thin,right:thin};
 const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('Inventory Count Form',{pageSetup:{orientation:'landscape',paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:0,margins:{left:.4,right:.4,top:.5,bottom:.5,header:.3,footer:.3}}});
 ws.columns=widths.map(w=>({width:w}));
 let r=1;
 const merged=(row,c1,c2,val,o={})=>{ws.mergeCells(row,c1,row,c2);const c=ws.getCell(row,c1);c.value=val;c.font={name:'Arial',size:o.size||10,bold:!!o.bold};c.alignment={horizontal:o.h||'left',vertical:'middle',wrapText:true};
  if(o.border)for(let k=c1;k<=c2;k++)ws.getCell(row,k).border=o.border;return c};
 if(lab){merged(r,1,n,'MINISTRY OF SCIENCE AND TECHNOLOGY',{bold:1,size:12,h:'center'});r++}
 merged(r,1,n,'Inventory Count Form',{bold:1,size:14,h:'center'});r++;
 r++;
 const q=Math.floor(n/4),g=[0,1,2,3].map(i=>[1+i*q,i===3?n:(i+1)*q]);
 merged(r,g[0][0],g[0][1],'PPE Account Group: '+(icf.ppe||MODS[icf.m].group),{bold:1});
 merged(r,g[1][0],g[1][1],'Category: '+(icf.cat||'PPE / ICS'),{bold:1});
 merged(r,g[2][0],g[2][1],'Property Category: '+(icf.pc||'ALL'),{bold:1});
 merged(r,g[3][0],g[3][1],'Division / Section: '+(icf.sec||'ALL'),{bold:1});r++;
 merged(r,g[3][0],g[3][1],'Sheet No. ____ of ____',{h:'right'});r++;
 r++;
 const hr=r;ws.getRow(hr).height=46;
 heads.forEach((h,i)=>{const c=ws.getCell(hr,i+1);c.value=h;c.font={name:'Arial',size:9,bold:true};c.alignment={horizontal:'center',vertical:'middle',wrapText:true};c.border=box;c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFD9D9D9'}}});
 r++;
 const nv=v=>(v===''||v==null||isNaN(parseFloat(v)))?'':parseFloat(v);
 rows.forEach((x,i)=>{
  const vals=[i+1,x.article||'',x.description||'',x.oldNo||'',x.propNumber||x.propNo||'',x.uom||'',nv(x.unitCost),nv(x.qty),nv(x.physical),x.location||'',x.condition||'',x.remarks||'',...(lab?[]:[x.category||''])];
  vals.forEach((v,k)=>{const c=ws.getCell(r,k+1);c.value=v;c.font={name:'Arial',size:9};c.border=box;
   c.alignment={vertical:'middle',wrapText:true,horizontal:[0,7,8].includes(k)?'center':(k===6?'right':'left')};if(k===6)c.numFmt='#,##0.00'});
  r++});
 if(!rows.length){merged(r,1,n,'No items for the selected filter',{h:'center',border:box});r++}
 ws.pageSetup.printTitlesRow=hr+':'+hr;
 r+=2;
 const sg=[['Prepared by:',sig.p,'Concerned Inventory','Committee Member'],['Verified by:',sig.v,'Concerned Inventory','Committee Member'],['Reviewed by:',sig.r,'Chairman, Inventory','Committee'],['Witnessed by:',sig.w,'COA Auditor / Representative','']];
 sg.forEach((x,i)=>{const [a,b]=g[i];
  merged(r,a,b,x[0],{h:'center'});
  ws.getRow(r+1).height=34;merged(r+1,a,b,x[1]||'',{bold:1,h:'center',border:{bottom:thin}});
  merged(r+2,a,b,'Print Name and Signature',{h:'center'});merged(r+3,a,b,x[2],{h:'center'});merged(r+4,a,b,x[3],{h:'center'})});
 const buf=await wb.xlsx.writeBuffer();
 const name='Inventory_Count_Form_'+(lab?'LAB':'REGION')+'_'+(icf.pc||'ALL').replace(/[^A-Za-z0-9]+/g,'-')+'_'+new Date().toISOString().slice(0,10)+'.xlsx';
 const url=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
 const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
}

   <div><b>Articles:</b> ${esc(r.description||r.article)}</div><div><b>SN:</b> ${esc(r.serial)}</div><div><b>ICS:</b> ${esc(r.ics)}</div>
   <div><b>Location:</b> ${esc(r.location)}</div><div><b>End User:</b> ${esc(r.endUser)}</div><div><b>Accountable:</b> ${esc(r.accountable)}</div>
   <div><b>Date Acquired:</b> ${esc(fmtDate(r.dateAcq))}</div></div>
   <div class="qr">${no?qrSvg(no):''}</div></div>
  <div class="sg"><span>COA Representative</span><span>Property Custodian</span><span>Inventory Representative</span></div></div>`}).join('')||'<div class="card empty">No items</div>'}</div>`;
}

function vMaster(){
 main.innerHTML=`<div class="card"><div class="bar"><h2 style="margin:0">Master Data (Dropdown Lists)</h2><span class="sp"></span>${isAdmin()?`<button class="b p" onclick="saveMaster()">💾 Save</button>`:''}</div>
 <p style="color:var(--mute);margin-top:0">One value per line. These appear as dropdown suggestions in the forms.</p>
 <div class="ml">${MASTER_DEFS.map(([k,l])=>`<div><label>${l}</label><textarea id="m_${k}" ${isAdmin()?'':'readonly'}>${esc(S.master[k].join('\n'))}</textarea></div>`).join('')}</div></div>`;

function saveMaster(){if(!isAdmin())return;MASTER_DEFS.forEach(([k])=>{S.master[k]=document.getElementById('m_'+k).value.split('\n').map(x=>x.trim()).filter(Boolean)});save();alert('Master Data saved ✔')}

/* ========= EXCEL IMPORT / EXPORT ========= */
function exportXlsx(){
 if(!window.XLSX)return alert('Excel library could not be loaded (internet required).');
 const wb=XLSX.utils.book_new();
 Object.keys(MODS).forEach(m=>{
  const fs=MODS[m].fields;
  const rows=S[m].map(r=>Object.fromEntries(fs.map(f=>[f.l,f.t==='num'||f.t==='calc'?(r[f.k]===''||r[f.k]==null?'':num(r[f.k])):r[f.k]??''])));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows,{header:fs.map(f=>f.l)}),MODS[m].sheet);
 });
 const md=[];const mx=Math.max(...MASTER_DEFS.map(([k])=>S.master[k].length),1);
 for(let i=0;i<mx;i++)md.push(Object.fromEntries(MASTER_DEFS.map(([k,l])=>[l,S.master[k][i]||''])));
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(md,{header:MASTER_DEFS.map(x=>x[1])}),'MasterData');
 XLSX.writeFile(wb,'Inventory_System_Export.xlsx');
}
function importPick(){if(!isAdmin())return;document.getElementById('imp').click()}
function importXlsx(inp){
 const file=inp.files[0];if(!file||!isAdmin())return;if(!window.XLSX)return alert('Excel library could not be loaded.');
 const rd=new FileReader();rd.onload=e=>{
  const wb=XLSX.read(e.target.result,{type:'array'});let added=0;
  Object.keys(MODS).forEach(m=>{
   const ws=wb.Sheets[MODS[m].sheet]||(wb.SheetNames.length===1&&wb.Sheets[wb.SheetNames[0]]&&m==='region'?wb.Sheets[wb.SheetNames[0]]:null);if(!ws)return;
   const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
   XLSX.utils.sheet_to_json(ws,{defval:''}).forEach(row=>{
    const map={};Object.keys(row).forEach(h=>map[norm(h)]=row[h]);
    const d={id:'i'+(S.seq++)+Date.now().toString(36)};
    MODS[m].fields.forEach(f=>{let v=map[norm(f.l)];if(v===undefined&&f.k==='section')v=map.sectiondivition;d[f.k]=v==null?'':String(v).trim()});
    if(Object.values(d).filter(Boolean).length<2)return;
    d.total=num(d.unitCost)*num(d.qty);S[m].push(d);added++;
   });
  });
  const mws=wb.Sheets['MasterData'];
  if(mws){const rows=XLSX.utils.sheet_to_json(mws,{defval:''});MASTER_DEFS.forEach(([k,l])=>{
   rows.forEach(r=>{const v=String(r[l]||'').trim();if(v&&!S.master[k].includes(v))S.master[k].push(v)})})}
  save();inp.value='';render();alert(`Imported: ${added} item(s).`);
 };rd.readAsArrayBuffer(file);
}

/* ========= LOGIN + GOOGLE SHEET ========= */
const DEFAULT_URL='https://script.google.com/macros/s/AKfycbzmxAhvXLnlZLzdx36eO0GixQChUscMMGQEI2mguGb83tpnFFOLPsGFJH5EkY5_nmCB7w/exec';
const CFGKEY='inventory_cfg_v2';
let cfg={url:DEFAULT_URL,session:'',user:'',role:''};
try{Object.assign(cfg,JSON.parse(localStorage.getItem(CFGKEY)||'{}'));localStorage.removeItem(KEY)}catch(e){}
const saveCfg=()=>{try{localStorage.setItem(CFGKEY,JSON.stringify(cfg))}catch(e){}};
let sync={state:'off',msg:'',rev:null,busy:false,dirty:false,t:null};
const nrm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
function badge(){const b=document.getElementById('syncb');if(!b)return;
 const m={off:['Not connected','#eef1f7','#6b7488'],pending:['Saving…','#fdf0d5','#b7791f'],ok:['Synced ✔','#dff5ec','#12805c'],err:['Sync error','#fbe3e0','#c0392b'],load:['Loading…','#e8efff','#1f5eff']}[sync.state];
 b.textContent='Google Sheet: '+m[0];b.style.background=m[1];b.style.color=m[2];b.title=sync.msg}
function toRow(m,r){return Object.fromEntries(MODS[m].fields.filter(f=>f.t!=='calc').map(f=>[f.l,f.t==='num'?(r[f.k]===''||r[f.k]==null?'':num(r[f.k])):(r[f.k]??'')]))}
function fromRow(m,row){const map={};Object.keys(row).forEach(h=>map[nrm(h)]=row[h]);
 const d={id:'i'+(S.seq++)+Date.now().toString(36)};
 MODS[m].fields.forEach(f=>{const v=map[nrm(f.l)];d[f.k]=v==null?'':String(v).trim()});
 d.total=num(d.unitCost)*num(d.qty);return d}

async function api(body){
 const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,session:cfg.session})});
 const j=await r.json();
 if(j.error&&/session expired/i.test(j.error)){forget();loginView('login','Session expired. Please log in again.')}
 return j}
function forget(){cfg.session='';cfg.user='';cfg.role='';saveCfg();S.region=[];S.lab=[];sync={state:'off',msg:'',rev:null,busy:false,dirty:false,t:null}}

function loginView(mode,msg,user){
 document.body.classList.add('locked');const setup=mode==='setup';
 lg.innerHTML=`<form class="card" onsubmit="return doLogin(event,'${mode}')">
  <h2 style="margin-top:0">📦 Inventory System</h2>
  <p style="color:var(--mute);margin:0">${setup?'First-time setup: create the Admin account.':'Please log in.'}</p>
  ${msg?`<p style="color:${/^Connecting/.test(msg)?'var(--mute)':'var(--bad)'}">${esc(msg)}</p>`:''}
  ${setup?`<label>Setup key (SETUP_KEY from Code.gs)</label><input id="lk" type="password" autocomplete="off" required>`:''}
  <label>Username</label><input id="lu" autocomplete="username" value="${esc(user||'')}" required>
  <label>Password</label><input id="lp" type="password" autocomplete="${setup?'new-password':'current-password'}" required>
  ${setup?`<label>Confirm password (min. 8 characters)</label><input id="lp2" type="password" autocomplete="new-password" required>`:''}
  <div class="mf" style="justify-content:flex-start"><button class="b p">${setup?'Create admin & log in':'Log in'}</button></div>
  <details style="margin-top:8px"><summary style="cursor:pointer;color:var(--mute)">Connection settings</summary>
   <label>Web app URL</label><input id="lurl" value="${esc(cfg.url)}"></details></form>`}
async function doLogin(e,mode){
 e.preventDefault();cfg.url=lurl.value.trim();saveCfg();
 const setup=mode==='setup';
 const u0=lu.value;
 if(setup&&lp.value!==lp2.value){loginView('setup','Passwords do not match.',u0);return false}
 try{
  const j=await api(setup?{action:'setup',key:lk.value,username:lu.value,password:lp.value}:{action:'login',username:lu.value,password:lp.value});
  if(j.error){loginView(mode,j.error,u0);return false}
  cfg.session=j.session;cfg.user=j.user;cfg.role=j.role;saveCfg();enterApp();
 }catch(err){loginView(mode,'Cannot reach the server: '+err.message,u0)}
 return false}
async function boot(){
 loginView('login','Connecting…');
 try{
  const st=await api({action:'status'});if(st.error)throw new Error(st.error);
  if(st.needsSetup){loginView('setup');return}
  if(cfg.session){const j=await api({action:'me'});if(j.ok){cfg.user=j.user;cfg.role=j.role;saveCfg();return enterApp()}}
  loginView('login');
 }catch(err){loginView('login','Cannot reach the server: '+err.message)}}
async function enterApp(){
 document.body.classList.remove('locked');tab='dash';
 try{await pull()}catch(err){sync.state='err';sync.msg=err.message;badge()}
 render();badge()}
async function logout(){try{await api({action:'logout'})}catch(e){}forget();loginView('login')}

async function pull(){
 sync.state='load';badge();
 const j=await api({action:'load'});if(j.error)throw new Error(j.error);
 ['region','lab'].forEach(m=>{S[m]=(j[m]||[]).map(r=>fromRow(m,r))});
 MASTER_DEFS.forEach(([k,l])=>{const v=(j.master||{})[l];if(v&&v.length)S.master[k]=v});
 cfg.role=j.role;sync.rev=j.rev;sync.state='ok';sync.msg='Loaded '+new Date().toLocaleTimeString();badge()}
async function push(){
 if(!isAdmin()||sync.rev==null)return;
 if(sync.busy){sync.dirty=true;return}
 sync.busy=true;
 try{do{
  sync.dirty=false;
  const j=await api({action:'save',baseRev:sync.rev,region:S.region.map(r=>toRow('region',r)),lab:S.lab.map(r=>toRow('lab',r)),
   master:Object.fromEntries(MASTER_DEFS.map(([k,l])=>[l,S.master[k]]))});
  if(j.conflict){sync.dirty=false;sync.busy=false;alert('Someone else changed the data (or the Sheet was edited). The latest data was loaded — please redo your last change.');await pull();render();return}
  if(j.error)throw new Error(j.error);
  sync.rev=j.rev;sync.state='ok';sync.msg='Saved '+new Date().toLocaleTimeString();
 }while(sync.dirty)}catch(e){sync.state='err';sync.msg=String(e.message||e)}
 sync.busy=false;badge()}
function schedulePush(){if(!isAdmin()||sync.rev==null)return;clearTimeout(sync.t);sync.state='pending';badge();sync.t=setTimeout(push,1500)}

 main.innerHTML='<div class="card empty">Loading users…</div>';
 const j=await api({action:'users.list'});if(j.error){main.innerHTML=`<div class="card empty">${esc(j.error)}</div>`;return}
 main.innerHTML=`<div class="card"><h2 style="margin-top:0">Users</h2>
  <p style="color:var(--mute)"><b>Admin</b> = full access. <b>Staff</b> = view and print only (cannot add, update or delete).</p>
  <div class="tw"><table><thead><tr><th>Username</th><th>Role</th><th>Active</th><th></th></tr></thead><tbody>
  ${j.users.map(u=>`<tr><td>${esc(u.username)}</td>
   <td><select onchange="userAct('${esc(u.username)}',{role:this.value})" style="width:auto"><option value="staff" ${u.role==='staff'?'selected':''}>Staff</option><option value="admin" ${u.role==='admin'?'selected':''}>Admin</option></select></td>
   <td><input type="checkbox" style="width:auto" ${u.active?'checked':''} onchange="userAct('${esc(u.username)}',{active:this.checked})"></td>

  </tbody></table></div></div>
  <div class="card" style="max-width:520px"><h3 style="margin-top:0">Add user</h3>
  <form onsubmit="return addUser(event)"><div class="fg" style="grid-template-columns:1fr">
   <div><label>Username</label><input id="nu" autocomplete="off" required></div>
   <div><label>Password (min. 8 characters)</label><input id="np" type="text" autocomplete="off" required></div>
   <div><label>Role</label><select id="nr"><option value="staff">Staff (view only)</option><option value="admin">Admin (full access)</option></select></div></div>
  <div class="mf" style="justify-content:flex-start"><button class="b p">＋ Add user</button></div></form></div>`}
async function userAct(u,patch){const j=await api({action:'users.update',username:u,...patch});if(j.error)alert(j.error);vUsers()}
async function resetPw(u){const p=prompt('New password for '+u+' (min. 8 characters):');if(!p)return;const j=await api({action:'users.update',username:u,password:p});alert(j.error||'Password changed ✔')}
async function delUser(u){if(!confirm('Delete user '+u+'?'))return;const j=await api({action:'users.delete',username:u});if(j.error)alert(j.error);vUsers()}
async function addUser(e){e.preventDefault();const j=await api({action:'users.add',username:nu.value,password:np.value,role:nr.value});if(j.error)alert(j.error);else alert('User added ✔');vUsers();return false}
